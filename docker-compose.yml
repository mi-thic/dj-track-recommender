# 開発用: PostgreSQL + Next.js 開発サーバー（ホットリロード）
#   docker compose up --build
#   → http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    container_name: dj-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dj
      POSTGRES_PASSWORD: djpass
      POSTGRES_DB: djapp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dj -d djapp"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: dev
    container_name: dj-app
    restart: unless-stopped
    command: sh -c "sh ./docker/migrate.sh && npm run dev"
    environment:
      DATABASE_URL: postgresql://dj:djpass@db:5432/djapp?schema=public
      SEED_ON_START: "true"
      # Windows / macOS のバインドマウントではポーリングの方が確実に検知できる
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # コンテナ側のものを使う（ホストの OS 依存バイナリで上書きしない）
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
