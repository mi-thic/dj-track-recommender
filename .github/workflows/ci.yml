name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest

    env:
      # DB には接続しないが、PrismaClient の生成時に必要なので形式だけ満たす値を渡す
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall で prisma generate が走る
      - name: 依存をインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: ビルド
        run: npm run build

      # Camelot 判定・BPM 計算・推薦スコア・rekordbox 解析・Spotify マッチング。
      # いずれも DB や外部 API を使わない純粋関数のテスト
      - name: テスト
        run: npm test
